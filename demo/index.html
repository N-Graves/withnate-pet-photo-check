<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pet photo check — demo</title>

    <link rel="stylesheet" href="demo.css" />
    <link rel="stylesheet" href="../dist/pet-photo-check.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Pet photo checker",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any modern browser",
        "browserRequirements": "Requires JavaScript",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" },
        "featureList": [
          "Whether a photo is sharp enough to paint a pet portrait from",
          "Whether it is big enough, measured from the file header",
          "Whether the lighting has crushed the shadows or blown the highlights",
          "Whether the subject is too small in the frame"
        ],
        "permissions": "None. The photo is measured in the browser and never uploaded."
      }
    </script>
  </head>
  <body>
    <main class="wrap">
      <p class="eyebrow">Before you order</p>
      <h1>Will this photo make a good portrait?</h1>
      <p class="lede">
        Drop in the photo you were going to send and find out before you send it. It is checked
        on your own device — nothing is uploaded, and nothing is kept.
      </p>

      <div data-ppc class="ppc">
        <div data-ppc-intake class="ppc-intake">
          <label class="btn" for="ppc-file">Choose a photo</label>
          <input
            id="ppc-file"
            type="file"
            accept="image/png,image/jpeg,image/gif,image/webp"
            class="vh"
          />
          <p class="ppc-note">…or drop one here, or paste from the clipboard.</p>
        </div>

        <p data-ppc-error class="ppc-error" role="status"></p>
        <p data-ppc-busy class="ppc-busy" role="status" hidden>Looking at it…</p>
        <div data-ppc-results></div>
      </div>

      <noscript>
        <p class="ppc-note">
          This needs JavaScript, because the whole point is that your photo is checked here on
          your machine rather than being sent anywhere.
        </p>
      </noscript>
    </main>

    <script src="../dist/pet-photo-check.js" defer></script>
  </body>
</html>
